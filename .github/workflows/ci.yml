name: CI

# Headless Godot CI for the RPG. Two gates run on every push to main + every PR:
#   1. the fast GUT suite (res://tests) — ~5300 unit/integration tests
#   2. validate_all.gd — content/wiring/navmesh validation (exit 1 on real breakage)
# A third gate, the SOAK job (real wandering NPCs + a game.tscn boot check), also runs on every push: it
# is the only automated thing that drives the real runtime, and it finishes in well under a minute.
# A fourth job, EXPORT, builds the Windows player from the tracked export_presets.cfg on every push to main
# and on every v* tag, uploads it as a run artifact, and on a tag attaches the zip to a GitHub Release — so
# a build is something the repo produces, not something one machine's Desktop remembers.
#
# This repo's root IS the Godot project (project.godot at the root), so every command runs from the
# checkout dir with no subdir cd. Godot is pinned via GODOT_VERSION — bump it when you upgrade the engine.
#
# ⚠ CI NEEDS THE REAL ASSETS (Git LFS). .gitattributes routes *.glb/*.png/*.jpg/*.wav/*.ogg/*.avif (and the
# dog's .obj) through LFS, and actions/checkout@v4 does NOT fetch LFS objects by default — it leaves ~130-byte
# POINTER FILES. The suite is NOT asset-independent: tuning resources hard-reference assets
# (resources/tuning/DialogueSettings.tres ext_resources a .wav), so on a pointer checkout that .tres fails to
# parse, AudioManager fails to compile, the GameSettings groups come back Nil, and about a third of the suite
# fails. Measured 2026-09-10 at fa8b275f: 1,631 of 5,020 failing on pointers, 5 of 5,331 with the real files —
# and those 5 were the then-untracked dog assets plus one save-file-dependent test, both fixed with this change.
# That is why every job below pulls LFS through a cache. The key is the sorted LFS object-id list, so an
# unchanged asset set costs no LFS bandwidth at all and a changed one fetches only the new objects (restore-keys
# seeds the previous set). The HEAD asset set is ~1.2 GB — do NOT swap this for `lfs: true` on the checkout,
# which bypasses the cache and re-downloads all of it on every push, for every job.
#
# ⚠ CI NEEDS BLENDER TOO. Four models are .blend files (assets/models/arm, leg, femalehead and
# stupidbody/stupidbody), and Godot imports a .blend by RUNNING Blender. With no Blender the import does not just
# skip them — it QUITS EARLY. Measured 2026-09-11 with the official 4.7.1 Linux build: ~126 of ~1,480 files
# imported and no .godot/uid_cache.bin, so every uid:// preload fails, AudioManager/InputManager fail to compile,
# `Character` fails to resolve, and the GUT step SEGFAULTED on a hollow test stub (exit 134 — the "Linux-only"
# crash was really "no Blender"). So both jobs install BLENDER_VERSION (cached) and write the editor setting Godot
# reads the path from (~/.config/godot/editor_settings-<major.minor>.tres) before importing.
#
# Two conventions every job below follows:
#   - Caches are SAVED right after they are filled (actions/cache/restore + actions/cache/save), never by the
#     combined actions/cache post-job hook — that hook skips the save when ANY later step fails, so a red run
#     would re-download ~1.2 GB of LFS objects and a 384 MB Blender on every push until the suite went green.
#   - A failing GUT step names its failures as ANNOTATIONS (the first 10, plus the GDScript frame of an engine
#     crash). Job logs need a GitHub login to read; annotations show on the run page and through the public API.

on:
  push:
    branches: [main]
    tags: ['v*']  # a version tag also runs the gates, and the export job turns it into a GitHub Release
  pull_request:
  workflow_dispatch:  # enables the manual "Run workflow" button — the jobs also run on push

# A newer push to the same ref cancels the in-flight run — saves Actions minutes on a solo project.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the MAJOR.MINOR in step with project.godot's `config/features`. The "Engine pin matches
  # project.godot" step below fails the build if they drift, because a CI that silently tests a different
  # engine than the game ships on reports engine breakage as a code bug.
  GODOT_VERSION: "4.7.1"
  # The Blender that imports the .blend models. Match the dev machine's (Steam's Blender, 5.2.1 LTS as of
  # 2026-09-11): the .blend files are saved by it, and an older Blender is not guaranteed to open them.
  BLENDER_VERSION: "5.2.1"

jobs:
  test-and-validate:
    name: Tests + content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Real assets, not pointers — see the header. The key is every LFS object id at this commit.
      - name: LFS object-id list (cache key)
        id: lfs-key
        run: echo "hash=$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore LFS object cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.hash }}
          restore-keys: lfs-

      - name: Pull LFS assets
        run: git lfs pull

      - name: Save LFS object cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.hash }}

      # Blender for the .blend imports — see the header. Cached per version; a miss downloads ~384 MB once.
      - name: Restore Blender cache
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender ${{ env.BLENDER_VERSION }}
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Save Blender cache
        if: steps.blender-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Point Godot at Blender
        run: |
          set -euo pipefail
          # Blender links X11/GL libraries even in --background mode, and the runner image does not ship all of them.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 libx11-6
          ~/blender/blender --version | head -n 1
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nfilesystem/import/blender/blender_path = "%s"\n' \
            "$HOME/blender/blender" > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres

      - name: Engine pin matches project.godot
        # config/features carries the engine major.minor the project is authored against. If the CI pin
        # drifts from it, every job silently tests an engine the game does not ship on — and the resulting
        # breakage reads as a code bug, which is the expensive way to find out. Cheap to check, so check.
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^config\/features=PackedStringArray("\([0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' project.godot)"
          if [ -z "$declared" ]; then
            echo "::error::could not read config/features out of project.godot"
            exit 1
          fi
          if [ "$declared" != "${GODOT_VERSION%.*}" ]; then
            echo "::error::CI pins Godot ${GODOT_VERSION} but project.godot declares ${declared} — bump GODOT_VERSION in this file"
            exit 1
          fi
          echo "project.godot declares ${declared}; CI pins ${GODOT_VERSION}. OK."

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$base/$zip" -o godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project (warm the class cache)
        # --import settles .godot/ + the global script class cache so a new class_name can't cascade into
        # "Could not find type X" / a Nil autoload. It can emit benign import warnings, so it must NOT gate
        # the job — a genuinely broken resource still surfaces as a failure in the test/validate steps below.
        run: godot --headless --import || true

      - name: Run GUT fast suite (res://tests)
        # -gexit makes GUT return a non-zero exit code on any test failure. The opt-in soak suite lives in
        # res://tests_soak (outside res://tests) so it is NOT picked up here. On failure, the first 10 failing
        # tests (and an engine crash's GDScript frame) become annotations — see the header.
        run: |
          set +e
          godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit 2>&1 | tee gut.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            sed -E 's/\x1b\[[0-9;]*m//g' gut.log | awk '
              /failing tests ----/ { exit }
              /^res:\/\/tests\/.*\.gd$/ { script = $0; test = "" }
              /^\* test_/ { test = substr($0, 3) }
              /\[Failed\]/ && test != "" { msg = $0; sub(/^[[:space:]]*\[Failed\]:[[:space:]]*/, "", msg); print script " :: " test " :: " msg }
            ' | awk '!seen[$0]++' | head -n 10 | while IFS= read -r line; do echo "::error title=GUT failure::${line:0:900}"; done
            if grep -q "handle_crash" gut.log; then
              frame="$(awk '/END OF C\+\+ BACKTRACE/ { f = 1 } f && /\[0\]/ { print; exit }' gut.log)"
              echo "::error title=Engine crash::$(grep -m1 'handle_crash' gut.log) — last GDScript frame:${frame}"
            fi
          fi
          exit "$status"

      - name: Validate content / wiring / navmesh
        # Exits 1 on any ERROR finding or content problem. WARNs + navmesh issues are reported but
        # non-blocking by default; append `-- --strict` to also fail on those.
        run: godot --headless -s scripts/tools/validate_all.gd

  soak:
    name: Soak (real runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same LFS cache as the test job (same key), so this job never pays for the download twice.
      - name: LFS object-id list (cache key)
        id: lfs-key
        run: echo "hash=$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore LFS object cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.hash }}
          restore-keys: lfs-

      - name: Pull LFS assets
        run: git lfs pull

      # Both jobs may race to save the same key on a miss; the loser only logs "unable to reserve cache".
      - name: Save LFS object cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.hash }}

      # Same Blender cache and setup as the test job — the import below quits early without it.
      - name: Restore Blender cache
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender ${{ env.BLENDER_VERSION }}
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Save Blender cache
        if: steps.blender-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Point Godot at Blender
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 libx11-6
          ~/blender/blender --version | head -n 1
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nfilesystem/import/blender/blender_path = "%s"\n' \
            "$HOME/blender/blender" > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$base/$zip" -o godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project (warm the class cache)
        run: godot --headless --import || true

      - name: Run soak suite (real wandering NPCs)
        # -gconfig points at the soak-only config so the default res://.gutconfig.json (res://tests) is NOT
        # loaded — only res://tests_soak runs. Failures become annotations, exactly as in the fast suite.
        run: |
          set +e
          godot --headless -s addons/gut/gut_cmdln.gd -gconfig=res://tests_soak/soak.gutconfig.json -gexit 2>&1 | tee soak.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            sed -E 's/\x1b\[[0-9;]*m//g' soak.log | awk '
              /failing tests ----/ { exit }
              /^res:\/\/tests_soak\/.*\.gd$/ { script = $0; test = "" }
              /^\* test_/ { test = substr($0, 3) }
              /\[Failed\]/ && test != "" { msg = $0; sub(/^[[:space:]]*\[Failed\]:[[:space:]]*/, "", msg); print script " :: " test " :: " msg }
            ' | awk '!seen[$0]++' | head -n 10 | while IFS= read -r line; do echo "::error title=Soak failure::${line:0:900}"; done
            if grep -q "handle_crash" soak.log; then
              frame="$(awk '/END OF C\+\+ BACKTRACE/ { f = 1 } f && /\[0\]/ { print; exit }' soak.log)"
              echo "::error title=Engine crash::$(grep -m1 'handle_crash' soak.log) — last GDScript frame:${frame}"
            fi
            # A soak that fails before any test runs (a config or parse problem) has no [Failed] line — show the tail.
            grep -q "\[Failed\]" soak.log || tail -n 5 soak.log | sed -E 's/\x1b\[[0-9;]*m//g' | while IFS= read -r line; do echo "::error title=Soak tail::${line:0:900}"; done
          fi
          exit "$status"

      - name: Boot gate (game.tscn raises no script errors)
        # BLOCKING since 2026-09-11. It landed non-blocking because CI then only ever saw LFS POINTER FILES; run
        # 34641592212 (a96577c3) was the first with the real assets AND Blender, and this gate passed there — so
        # the `continue-on-error` it shipped with is gone and a boot that spews script errors now fails the job.
        # The soak suite only ever boots NavSandbox.tscn, so the REAL boot chain — 38 autoloads and the
        # game scene itself — has no automated coverage at all. GUT's error tracker only sees errors raised
        # while one of ITS tests is running; anything a boot spews outside that window is invisible.
        # Two traps this step is shaped around:
        #   - `--quit-after` exits 0 no matter what the engine printed, so the exit code proves nothing.
        #   - Godot writes script errors to STDERR, so the log must be captured with 2>&1 before grepping.
        # The grep IS the gate. Match ONLY "SCRIPT ERROR" — it already prefixes the parse/compile failures
        # that matter ("SCRIPT ERROR: Parse Error: ..."), while broader patterns like "Cannot open file"
        # also fire on benign missing-import noise and would make this gate flaky on a fresh checkout.
        run: |
          set -uo pipefail
          godot --headless scenes/game.tscn --quit-after 300 > boot.log 2>&1 || true
          tail -n 40 boot.log
          if grep -q "SCRIPT ERROR" boot.log; then
            echo "::error::game.tscn boot produced script errors — see the log above"
            exit 1
          fi
          echo "game.tscn booted clean."

  export-windows:
    name: Export (Windows Desktop)
    # Only from a GREEN tree: an artifact nobody can trust is worse than none. Skipped on pull requests — a
    # contributor's PR does not need a 1 GB build, and the preset's filters are exercised by the gates anyway.
    needs: [test-and-validate, soak]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create/upload on a v* tag; a plain push never touches releases
    env:
      # Where the export lands on the runner. Mirrors the preset's local `build/` — which is .gitignored and
      # .gdignored in the repo — but named apart so a stray local checkout can never be mistaken for it.
      DIST_DIR: dist
    steps:
      - uses: actions/checkout@v4

      # Same LFS cache as the other jobs (same key): the export packs the REAL assets, never pointers.
      - name: LFS object-id list (cache key)
        id: lfs-key
        run: echo "hash=$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore LFS object cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.hash }}
          restore-keys: lfs-

      - name: Pull LFS assets
        run: git lfs pull

      - name: Save LFS object cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.hash }}

      # Same Blender cache and setup as the other jobs — the export runs the import first, and the import quits
      # early without Blender (see the header).
      - name: Restore Blender cache
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender ${{ env.BLENDER_VERSION }}
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Save Blender cache
        if: steps.blender-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Point Godot at Blender
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 libx11-6
          ~/blender/blender --version | head -n 1
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nfilesystem/import/blender/blender_path = "%s"\n' \
            "$HOME/blender/blender" > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$base/$zip" -o godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      # The Windows export templates. The official .tpz bundles every platform (~1 GB), so only the windows_*
      # files are kept, in the exact directory the exporter looks in (<data dir>/export_templates/<version>.stable/).
      # Cached per engine version; a miss downloads the bundle once.
      - name: Restore export-template cache
        id: templates-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: export-templates-${{ env.GODOT_VERSION }}-windows

      - name: Download Godot ${{ env.GODOT_VERSION }} Windows export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -j -o -q templates.tpz 'templates/windows_*' 'templates/version.txt' -d "$dest"
          rm templates.tpz
          ls -l "$dest"

      - name: Save export-template cache
        if: steps.templates-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: export-templates-${{ env.GODOT_VERSION }}-windows

      - name: Import project (warm the class cache)
        run: godot --headless --import || true

      - name: Export "Windows Desktop" (release)
        # The preset is TRACKED (export_presets.cfg): the same filters, console wrapper and font-licence include
        # every developer exports with. Headless on purpose — the editor GUI export has crashed mid-pck on this
        # project (heap corruption), the CLI export of the same preset never has. Godot exits 0 on a failed
        # export more often than it should, so the gate is the four shipped files existing, not the exit code.
        # rcedit is not installed on the runner, so the exe carries the stock Godot icon (a warning, not a failure).
        run: |
          set -uo pipefail
          mkdir -p "$DIST_DIR"
          godot --headless --export-release "Windows Desktop" "$DIST_DIR/CYBERSUNDAY.exe" 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          if grep -q "SCRIPT ERROR" export.log; then
            echo "::error::the export raised script errors — see the log above"
            exit 1
          fi
          missing=0
          for f in CYBERSUNDAY.exe CYBERSUNDAY.pck CYBERSUNDAY.console.exe libgodot_text_to_speech.dll; do
            if [ ! -s "$DIST_DIR/$f" ]; then
              echo "::error::export did not produce $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          [ "$status" -eq 0 ] || { echo "::error::godot --export-release exited $status"; exit "$status"; }
          ls -l "$DIST_DIR"
          echo "pck size: $(du -h "$DIST_DIR/CYBERSUNDAY.pck" | cut -f1)"

      - name: Zip the build
        # One zip, all four files: the TTS GDExtension DLL ships beside the exe and the build dies on launch without it.
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          name="CYBERSUNDAY-windows-${GITHUB_REF_NAME//\//-}-${short}"
          echo "name=$name" >> "$GITHUB_ENV"
          (cd "$DIST_DIR" && zip -q -r "../$name.zip" .)
          ls -l "$name.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}.zip
          retention-days: 14
          compression-level: 0  # already a zip

      - name: Publish GitHub Release (tags only)
        # `git tag -a v0.1.0 -m "..." && git push origin v0.1.0` is the whole release procedure: this step attaches
        # the zip to a Release named after the tag, with auto-generated notes from the commits since the last tag.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$name.zip" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
